name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-release:
    name: Build and Release - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: acode-live-server-linux-x64.tar.gz
            build_script: |
              pyinstaller --onefile --name acode-live-server main.py
              mkdir -p dist/acode-live-server-linux-x64
              cp dist/acode-live-server dist/acode-live-server-linux-x64/
              cp config.json eruda.min.js zoom-handler.js readme.md requirements.txt dist/acode-live-server-linux-x64/
              cp -r modules dist/acode-live-server-linux-x64/
              cd dist && tar -czf acode-live-server-linux-x64.tar.gz acode-live-server-linux-x64
          - os: windows-latest
            asset_name: acode-live-server-windows-x64.zip
            build_script: |
              pyinstaller --onefile --name acode-live-server.exe main.py
              New-Item -ItemType Directory -Path dist\acode-live-server-windows-x64
              Copy-Item dist\acode-live-server.exe dist\acode-live-server-windows-x64\
              Copy-Item config.json, eruda.min.js, zoom-handler.js, readme.md, requirements.txt dist\acode-live-server-windows-x64\
              Copy-Item -Recurse modules dist\acode-live-server-windows-x64\
              Compress-Archive -Path dist\acode-live-server-windows-x64\* -DestinationPath dist\acode-live-server-windows-x64.zip
          - os: macos-latest
            asset_name: acode-live-server-macos-x64.tar.gz
            build_script: |
              pyinstaller --onefile --name acode-live-server main.py
              mkdir -p dist/acode-live-server-macos-x64
              cp dist/acode-live-server dist/acode-live-server-macos-x64/
              cp config.json eruda.min.js zoom-handler.js readme.md requirements.txt dist/acode-live-server-macos-x64/
              cp -r modules dist/acode-live-server-macos-x64/
              cd dist && tar -czf acode-live-server-macos-x64.tar.gz acode-live-server-macos-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.build_script }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ${{ matrix.build_script }}

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          if [ -f changelogs.md ]; then
            CHANGELOG=$(cat changelogs.md)
          else
            CHANGELOG="Release ${{ steps.get_version.outputs.version }}"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Acode Live Server Backend ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
