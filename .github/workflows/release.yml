name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f changelogs.md ]; then
            CHANGELOG=$(cat changelogs.md)
          else
            CHANGELOG="Release ${{ steps.get_version.outputs.version }}"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Acode Live Server Backend ${{ steps.get_version.outputs.version }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build and Upload - ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: acode-live-server-linux-x64
            asset_path: dist/acode-live-server-linux-x64.tar.gz
          - os: windows-latest
            asset_name: acode-live-server-windows-x64
            asset_path: dist/acode-live-server-windows-x64.zip
          - os: macos-latest
            asset_name: acode-live-server-macos-x64
            asset_path: dist/acode-live-server-macos-x64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name acode-live-server main.py
          mkdir -p dist/acode-live-server-${{ runner.os }}-x64
          cp dist/acode-live-server dist/acode-live-server-${{ runner.os }}-x64/
          cp config.json eruda.min.js zoom-handler.js readme.md requirements.txt dist/acode-live-server-${{ runner.os }}-x64/
          cp -r modules dist/acode-live-server-${{ runner.os }}-x64/
          cd dist && tar -czf acode-live-server-$(echo ${{ runner.os }} | tr '[:upper:]' '[:lower:]')-x64.tar.gz acode-live-server-${{ runner.os }}-x64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller --onefile --name acode-live-server.exe main.py
          New-Item -ItemType Directory -Path dist\acode-live-server-Windows-x64
          Copy-Item dist\acode-live-server.exe dist\acode-live-server-Windows-x64\
          Copy-Item config.json, eruda.min.js, zoom-handler.js, readme.md, requirements.txt dist\acode-live-server-Windows-x64\
          Copy-Item -Recurse modules dist\acode-live-server-Windows-x64\
          Compress-Archive -Path dist\acode-live-server-Windows-x64\* -DestinationPath dist\acode-live-server-windows-x64.zip

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ matrix.asset_path }}
          asset_name: ${{ matrix.asset_name }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          asset_content_type: application/${{ runner.os == 'Windows' && 'zip' || 'gzip' }}
